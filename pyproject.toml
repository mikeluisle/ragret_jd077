[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mikeluisle-ragret_jd077"
version = "0.1.0"
description = "从样本里推断RAG 检索工程师·越狱模板的变体识别应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mikeluisle" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mikeluisle.github.io"
Repository = "https://github.com/mikeluisle/ragret_jd077"
Issues = "https://github.com/mikeluisle/ragret_jd077/issues"

[project.scripts]
ragret_jd077 = "ragret_jd077:main"

[tool.setuptools]
py-modules = ["ragret_jd077"]
